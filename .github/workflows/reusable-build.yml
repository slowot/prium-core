name: reusable-build
on:
  workflow_call:
    inputs:
      python-version:
        type: string
        required: false
        default: '3.12'
      track:
        type: string
        required: false
        default: 'release'
      resume_run_id:
        type: string
        required: false
        default: ''

jobs:
  build-1:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Prepare
        uses: ./.github/actions/prepare
        with:
          python-version: ${{ inputs.python-version }}
      - name: Run Stage
        id: stage
        uses: ./.github/actions/stage
        env:
          GH_TOKEN: ${{ github.token }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        with:
          finished: false
          from_artifact: false
          track: ${{ inputs.track }}
          resume_run_id: ${{ inputs.resume_run_id }}
    outputs:
      finished: ${{ steps.stage.outputs.finished }}

  build-2:
    needs: build-1
    if: needs.build-1.outputs.finished == 'false'
    runs-on: windows-2022
    steps:
